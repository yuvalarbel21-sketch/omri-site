<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Alef', sans-serif;
  background: #1C2537;
  color: #fff;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  direction: rtl;
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 24px;
  padding: 56px 48px;
  max-width: 520px;

}
.icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;

  border: 2px solid #C9A84C;

  align-items: center;
  justify-content: center;

}
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #C9A84C;
  margin-bottom: 16px;
}
p {
  font-size: 17px;
  color: rgba(255,255,255,0.75);
  line-height: 1.7;
  margin-bottom: 10px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 36px;
  background: #C9A84C;
  color: #1C2537;
  font-family: 'Alef', sans-serif;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 28px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s, transform 0.1s;
}
.back-btn:hover { background: #A07830; transform: translateY(-1px); }
.logo {
  width: 70px;
  height: auto;
  margin: 0 auto 32px;
  opacity: 0.85;
}
</style>
</head>

  </div>
